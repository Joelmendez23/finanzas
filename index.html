<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Mis Finanzas</title>
<style>
:root{--bg:#0b0f14;--card:#151b23;--card2:#1c2430;--line:#2a3441;--tx:#e6edf3;--mu:#8b949e;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--yel:#e3b341;--ac:#58a6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:rgba(11,15,20,.92);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px}
main{padding:14px 16px calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:rgba(21,27,35,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0 6px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .n{font-weight:600}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
h2{font-size:16px;margin:18px 0 8px}
h2:first-child{margin-top:0}
.btn{background:var(--ac);color:#04121f;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mu);margin-left:6px}
.empty{color:var(--mu);text-align:center;padding:20px 0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;font-family:inherit}
textarea{min-height:120px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:8px;font-weight:600}
.seg button.on{background:var(--ac);color:#04121f}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30}
</style>
</head>
<body>
<header><div class="row"><h1 id="titulo">Inicio</h1><span class="mu" id="fechaHoy"></span></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
'use strict';
const KEY='finanzas_joel_v3';
const TABS=[['inicio','🏠','Inicio'],['tarjetas','💳','Tarjetas'],['servicios','🧾','Servicios'],['prestamos','🏦','Préstamos'],['movs','↕️','Movim.'],['presupuesto','🎯','Presup.'],['datos','💾','Datos']];
const CAT_GASTO=['Comida','Transporte','Servicios','Préstamos','Ocio','Salud','Hogar','Educación','Ropa','Negocio','Otros'];
const CAT_INGRESO=['Salario','Negocio','Uber','Internet clientes','Otros ingresos'];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'RD$'+(Number(n)||0).toLocaleString('es-DO',{minimumFractionDigits:0,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoy=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const mesActual=()=>iso(hoy()).slice(0,7);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function fechaConDia(y,m,dia){const b=new Date(y,m,1);return new Date(b.getFullYear(),b.getMonth(),Math.min(dia,dim(b.getFullYear(),b.getMonth())))}
function primerVenc(dia){const t=hoy();const f=fechaConDia(t.getFullYear(),t.getMonth(),dia);return f>=t?f:fechaConDia(t.getFullYear(),t.getMonth()+1,dia)}
function avanzar(fIso,dia,freq,sign=1){const f=parse(fIso);const n=freq==='anual'?12:1;return iso(fechaConDia(f.getFullYear(),f.getMonth()+n*sign,dia))}
const dias=fIso=>Math.round((parse(fIso)-hoy())/864e5);
function semaforo(fIso){const d=dias(fIso);if(d<0)return['🔴',`Vencido hace ${-d} d`];if(d===0)return['🔴','Vence hoy'];if(d===1)return['🟠','Mañana'];if(d<=7)return['🟡',`En ${d} días`];return['🟢',`En ${d} días`]}
const fechaCorta=fIso=>parse(fIso).toLocaleDateString('es-DO',{day:'numeric',month:'short'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

/* ---------- estado ---------- */
function estadoInicial(){
  const s=(nombre,monto,dia)=>({id:uid(),nombre,monto,dia,frecuencia:'mensual',categoria:'Servicios',proximo:iso(primerVenc(dia)),pagos:[]});
  const p=(nombre,cuota,dia,cuotasRestantes)=>({id:uid(),nombre,cuota,dia,cuotasRestantes,saldo:0,proximo:iso(primerVenc(dia)),pagos:[]});
  const pres={};CAT_GASTO.forEach(c=>pres[c]=0);
  return{version:3,cuentas:{efectivo:0,debito:0},tarjetas:[],
    servicios:[s('Agua KM 14',500,1),s('Luz KM 22',2000,9),s('Internet KM 14',1960,10),s('Internet Celular',1080,15),s('Claude IA',1231,18),s('Luz KM 14',2000,19),s('Internet KM 22',2750,20)],
    prestamos:[p('QIK',16200,20,44),p('Cooperativa La Sureña',9980,29,32)],
    movs:[],presupuesto:pres};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.cuentas)S=estadoInicial();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar')}}
save();
let tab='inicio', mesFiltro=mesActual();

/* ---------- movimientos y saldos ---------- */
function aplicar(m,sign){
  const v=sign*Number(m.monto);
  if(m.tipo==='pagoTarjeta'){S.cuentas[m.cuenta]-=v;const t=S.tarjetas.find(x=>x.id===m.tarjeta);if(t)t.saldo-=v;return}
  const signo=m.tipo==='ingreso'?1:-1;
  if(m.cuenta==='efectivo'||m.cuenta==='debito')S.cuentas[m.cuenta]+=signo*v;
  else{const t=S.tarjetas.find(x=>x.id===m.cuenta);if(t)t.saldo-=signo*v}
}
function agregarMov(m){m.id=m.id||uid();S.movs.unshift(m);aplicar(m,1);return m.id}
function borrarMov(id){const i=S.movs.findIndex(m=>m.id===id);if(i<0)return;aplicar(S.movs[i],-1);S.movs.splice(i,1)}
const nombreCuenta=c=>c==='efectivo'?'Efectivo':c==='debito'?'Débito':(S.tarjetas.find(t=>t.id===c)?.nombre||'Tarjeta');
const opcionesCuenta=()=>[['debito','Tarjeta débito'],['efectivo','Efectivo'],...S.tarjetas.map(t=>[t.id,'💳 '+t.nombre])];

/* ---------- formularios (hoja inferior) ---------- */
function form(titulo,campos,onOk,extra=''){
  const html=campos.map(f=>{
    const v=esc(f.value??'');
    let input;
    if(f.type==='select')input=`<select name="${f.name}">${f.options.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(f.value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')input=`<textarea name="${f.name}">${v}</textarea>`;
    else input=`<input name="${f.name}" type="${f.type||'text'}" value="${v}" ${f.type==='number'?'inputmode="decimal" step="any"':''} ${f.req?'required':''}>`;
    return`<label>${esc(f.label)}</label>${input}`}).join('');
  $('#modal').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)cerrar()"><form class="sheet" id="frm"><h3>${esc(titulo)}</h3>${html}${extra}<div class="acts" style="margin-top:16px"><button class="btn" type="submit" style="flex:1">Guardar</button><button class="btn sec" type="button" onclick="cerrar()">Cancelar</button></div></form></div>`;
  $('#frm').onsubmit=e=>{e.preventDefault();const d={};new FormData(e.target).forEach((v,k)=>d[k]=v);
    campos.forEach(f=>{if(f.type==='number')d[f.name]=Number(d[f.name])||0});
    if(onOk(d)!==false){cerrar();save();render()}};
}
function cerrar(){$('#modal').innerHTML=''}

/* ---------- pagos recurrentes ---------- */
function lista(tipo){return tipo==='servicio'?S.servicios:S.prestamos}
function pagar(tipo,id){
  const it=lista(tipo).find(x=>x.id===id);if(!it)return;
  const monto=tipo==='servicio'?it.monto:it.cuota;
  form(`Pagar ${it.nombre}`,[
    {name:'monto',label:'Monto',type:'number',value:monto},
    {name:'cuenta',label:'Pagado desde',type:'select',options:opcionesCuenta(),value:'debito'},
    {name:'fecha',label:'Fecha de pago',type:'date',value:iso(hoy())}],d=>{
      const movId=agregarMov({tipo:'gasto',monto:d.monto,cuenta:d.cuenta,fecha:d.fecha,categoria:tipo==='servicio'?(it.categoria||'Servicios'):'Préstamos',nota:it.nombre});
      it.pagos.push({periodo:it.proximo,movId});
      it.proximo=avanzar(it.proximo,it.dia,it.frecuencia||'mensual');
      if(tipo==='prestamo'&&it.cuotasRestantes>0)it.cuotasRestantes--;
      toast('✅ Pago registrado');
    });
}
function deshacer(tipo,id){
  const it=lista(tipo).find(x=>x.id===id);const p=it?.pagos.pop();if(!p)return toast('No hay pagos para deshacer');
  borrarMov(p.movId);it.proximo=p.periodo;if(tipo==='prestamo')it.cuotasRestantes++;
  save();render();toast('↩️ Pago deshecho');
}
function editarServicio(id){
  const it=id?S.servicios.find(x=>x.id===id):null;
  form(it?'Editar servicio':'Nuevo servicio',[
    {name:'nombre',label:'Nombre',value:it?.nombre,req:1},
    {name:'monto',label:'Monto',type:'number',value:it?.monto},
    {name:'dia',label:'Día de pago (1-31)',type:'number',value:it?.dia||1},
    {name:'frecuencia',label:'Frecuencia',type:'select',options:[['mensual','Mensual'],['anual','Anual']],value:it?.frecuencia||'mensual'},
    {name:'categoria',label:'Categoría',type:'select',options:CAT_GASTO.map(c=>[c,c]),value:it?.categoria||'Servicios'},
    {name:'proximo',label:'Próximo vencimiento',type:'date',value:it?.proximo||''}],d=>{
      d.dia=Math.min(31,Math.max(1,Math.round(d.dia)));
      if(!d.proximo)d.proximo=iso(primerVenc(d.dia));
      if(it)Object.assign(it,d);else S.servicios.push({id:uid(),pagos:[],...d});
    });
}
function editarPrestamo(id){
  const it=id?S.prestamos.find(x=>x.id===id):null;
  form(it?'Editar préstamo':'Nuevo préstamo',[
    {name:'nombre',label:'Nombre',value:it?.nombre,req:1},
    {name:'cuota',label:'Cuota mensual',type:'number',value:it?.cuota},
    {name:'dia',label:'Día de pago (1-31)',type:'number',value:it?.dia||1},
    {name:'cuotasRestantes',label:'Cuotas restantes',type:'number',value:it?.cuotasRestantes??12},
    {name:'saldo',label:'Saldo pendiente (opcional)',type:'number',value:it?.saldo||0},
    {name:'proximo',label:'Próximo vencimiento',type:'date',value:it?.proximo||''}],d=>{
      d.dia=Math.min(31,Math.max(1,Math.round(d.dia)));d.cuotasRestantes=Math.max(0,Math.round(d.cuotasRestantes));
      if(!d.proximo)d.proximo=iso(primerVenc(d.dia));
      if(it)Object.assign(it,d);else S.prestamos.push({id:uid(),pagos:[],...d});
    });
}
function eliminar(coleccion,id){if(!confirm('¿Eliminar? No se puede deshacer.'))return;S[coleccion]=S[coleccion].filter(x=>x.id!==id);save();render()}
function fechaFin(p){if(!p.cuotasRestantes)return'Pagado';const f=parse(p.proximo);return fechaConDia(f.getFullYear(),f.getMonth()+p.cuotasRestantes-1,p.dia).toLocaleDateString('es-DO',{month:'short',year:'numeric'})}

/* ---------- tarjetas ---------- */
function editarTarjeta(id){
  const t=id?S.tarjetas.find(x=>x.id===id):null;
  form(t?'Editar tarjeta':'Nueva tarjeta de crédito',[
    {name:'nombre',label:'Nombre (ej. Popular Visa)',value:t?.nombre,req:1},
    {name:'limite',label:'Límite de crédito',type:'number',value:t?.limite},
    {name:'saldo',label:'Saldo usado (deuda actual)',type:'number',value:t?.saldo||0},
    {name:'diaCorte',label:'Día de corte',type:'number',value:t?.diaCorte||1},
    {name:'diaPago',label:'Día límite de pago',type:'number',value:t?.diaPago||20}],d=>{
      if(t)Object.assign(t,d);else S.tarjetas.push({id:uid(),...d});
    });
}
function pagarTarjeta(id){
  const t=S.tarjetas.find(x=>x.id===id);
  form(`Pagar ${t.nombre}`,[
    {name:'monto',label:'Monto a pagar',type:'number',value:t.saldo},
    {name:'cuenta',label:'Desde',type:'select',options:[['debito','Tarjeta débito'],['efectivo','Efectivo']],value:'debito'},
    {name:'fecha',label:'Fecha',type:'date',value:iso(hoy())}],d=>{
      agregarMov({tipo:'pagoTarjeta',tarjeta:t.id,monto:d.monto,cuenta:d.cuenta,fecha:d.fecha,categoria:'Pago tarjeta',nota:'Pago '+t.nombre});toast('✅ Pago aplicado');
    });
}

/* ---------- movimientos ---------- */
let tipoNuevo='gasto';
function nuevoMov(tipo){
  tipoNuevo=tipo||tipoNuevo;const cats=tipoNuevo==='gasto'?CAT_GASTO:CAT_INGRESO;
  const seg=`<div class="seg" style="margin-top:4px"><button type="button" class="${tipoNuevo==='gasto'?'on':''}" onclick="nuevoMov('gasto')">Gasto</button><button type="button" class="${tipoNuevo==='ingreso'?'on':''}" onclick="nuevoMov('ingreso')">Ingreso</button></div>`;
  form(tipoNuevo==='gasto'?'Nuevo gasto':'Nuevo ingreso',[
    {name:'monto',label:'Monto',type:'number',req:1},
    {name:'categoria',label:'Categoría',type:'select',options:cats.map(c=>[c,c]),value:cats[0]},
    {name:'cuenta',label:tipoNuevo==='gasto'?'Pagado con':'Depositado en',type:'select',options:tipoNuevo==='gasto'?opcionesCuenta():[['debito','Tarjeta débito'],['efectivo','Efectivo']],value:'debito'},
    {name:'fecha',label:'Fecha',type:'date',value:iso(hoy())},
    {name:'nota',label:'Nota (opcional)'}],d=>{
      if(d.monto<=0){toast('Monto inválido');return false}
      agregarMov({tipo:tipoNuevo,...d});toast('✅ Guardado');
    },seg);
}
function ajustarCuenta(c){
  form('Ajustar '+(c==='efectivo'?'efectivo':'tarjeta débito'),[{name:'v',label:'Saldo real actual',type:'number',value:S.cuentas[c]}],d=>{S.cuentas[c]=d.v});
}
function delMov(id){if(!confirm('¿Eliminar movimiento? Se revierte su efecto en el saldo.'))return;borrarMov(id);save();render()}

/* ---------- cálculos ---------- */
function proximosPagos(diasMax=31){
  const out=[];
  S.servicios.forEach(s=>out.push({tipo:'servicio',id:s.id,nombre:s.nombre,monto:s.monto,fecha:s.proximo}));
  S.prestamos.filter(p=>p.cuotasRestantes>0).forEach(p=>out.push({tipo:'prestamo',id:p.id,nombre:p.nombre,monto:p.cuota,fecha:p.proximo}));
  S.tarjetas.filter(t=>t.saldo>0).forEach(t=>out.push({tipo:'tarjeta',id:t.id,nombre:'💳 '+t.nombre,monto:t.saldo,fecha:iso(primerVenc(t.diaPago))}));
  return out.filter(x=>dias(x.fecha)<=diasMax).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function gastosMes(mes){const r={};S.movs.filter(m=>m.tipo==='gasto'&&m.fecha.startsWith(mes)).forEach(m=>r[m.categoria]=(r[m.categoria]||0)+m.monto);return r}
const deudaTarjetas=()=>S.tarjetas.reduce((a,t)=>a+(t.saldo||0),0);

/* ---------- vistas ---------- */
function filaPago(x){
  const[ic,txt]=semaforo(x.fecha);
  const btn=x.tipo==='tarjeta'?`pagarTarjeta('${x.id}')`:`pagar('${x.tipo}','${x.id}')`;
  return`<div class="item"><div><div class="n">${ic} ${esc(x.nombre)}</div><div class="mu">${fechaCorta(x.fecha)} · ${txt}</div></div><div style="text-align:right"><div class="amt">${fmt(x.monto)}</div><button class="btn sm sec" style="margin-top:4px" onclick="${btn}">Pagar</button></div></div>`;
}
const V={};
V.inicio=()=>{
  const disp=S.cuentas.efectivo+S.cuentas.debito, deuda=deudaTarjetas();
  const prox=proximosPagos(30), totProx=prox.reduce((a,x)=>a+x.monto,0);
  const mes=mesActual(), g=gastosMes(mes), gTot=Object.values(g).reduce((a,b)=>a+b,0);
  const ing=S.movs.filter(m=>m.tipo==='ingreso'&&m.fecha.startsWith(mes)).reduce((a,m)=>a+m.monto,0);
  const presTot=Object.values(S.presupuesto).reduce((a,b)=>a+b,0);
  const alcanza=disp-totProx;
  return`<div class="card"><div class="mu">Balance total</div><div class="big">${fmt(disp)}</div>
   ${deuda?`<div class="mu" style="margin-top:4px">Deuda tarjetas: <span class="neg">${fmt(deuda)}</span> · Neto: ${fmt(disp-deuda)}</div>`:''}
   <div class="mu" style="margin-top:6px">Después de pagos de 30 días: <b class="${alcanza<0?'neg':'pos'}">${fmt(alcanza)}</b></div></div>
  <div class="grid2"><div class="card" onclick="ajustarCuenta('efectivo')"><div class="mu">💵 Efectivo</div><div class="amt" style="font-size:19px">${fmt(S.cuentas.efectivo)}</div><div class="mu" style="font-size:11px">Toca para ajustar</div></div>
   <div class="card" onclick="ajustarCuenta('debito')"><div class="mu">🏧 Débito</div><div class="amt" style="font-size:19px">${fmt(S.cuentas.debito)}</div><div class="mu" style="font-size:11px">Toca para ajustar</div></div></div>
  <div class="acts" style="margin:0 0 12px"><button class="btn" style="flex:1" onclick="nuevoMov('gasto')">− Gasto</button><button class="btn sec" style="flex:1" onclick="nuevoMov('ingreso')">+ Ingreso</button></div>
  <div class="card"><div class="row"><h2 style="margin:0">Pagos próximos (30 días)</h2><span class="amt">${fmt(totProx)}</span></div>
   ${prox.length?prox.map(filaPago).join(''):'<div class="empty">Nada pendiente 🎉</div>'}</div>
  <div class="card"><h2>Este mes</h2><div class="row"><span class="mu">Ingresos</span><span class="amt pos">${fmt(ing)}</span></div>
   <div class="row" style="margin-top:6px"><span class="mu">Gastos</span><span class="amt neg">${fmt(gTot)}</span></div>
   ${presTot?`<div class="row" style="margin-top:6px"><span class="mu">Presupuesto usado</span><span class="amt">${Math.round(gTot/presTot*100)}%</span></div><div class="bar"><i style="width:${Math.min(100,gTot/presTot*100)}%;background:${gTot>presTot?'var(--bad)':gTot>presTot*.8?'var(--warn)':'var(--ok)'}"></i></div>`:''}</div>`;
};
V.tarjetas=()=>`<button class="btn full" style="margin:0 0 12px" onclick="editarTarjeta()">+ Agregar tarjeta de crédito</button>`+
  (S.tarjetas.length?S.tarjetas.map(t=>{const uso=t.limite?t.saldo/t.limite*100:0;const[ic,tx]=semaforo(iso(primerVenc(t.diaPago)));
   return`<div class="card"><div class="row"><b>💳 ${esc(t.nombre)}</b><span class="amt neg">${fmt(t.saldo)}</span></div>
   <div class="mu">Disponible ${fmt((t.limite||0)-(t.saldo||0))} de ${fmt(t.limite)} · Corte día ${t.diaCorte} · Pago día ${t.diaPago}</div>
   <div class="bar"><i style="width:${Math.min(100,uso)}%;background:${uso>70?'var(--bad)':uso>30?'var(--warn)':'var(--ok)'}"></i></div>
   <div class="mu" style="margin-top:6px">${ic} Próximo pago: ${tx} · Uso ${Math.round(uso)}%${uso>30?' (ideal &lt;30%)':''}</div>
   <div class="acts"><button class="btn sm" onclick="pagarTarjeta('${t.id}')">Pagar</button><button class="btn sm sec" onclick="editarTarjeta('${t.id}')">Editar</button><button class="btn sm sec" onclick="eliminar('tarjetas','${t.id}')">Eliminar</button></div></div>`}).join(''):'<div class="card empty">Aún no tienes tarjetas registradas.<br>Los gastos con tarjeta de crédito suman a su deuda.</div>');
function quincena(q){
  const items=[...S.servicios.map(s=>({...s,m:s.monto,t:'servicio'})),...S.prestamos.filter(p=>p.cuotasRestantes>0).map(p=>({...p,m:p.cuota,t:'prestamo'}))]
    .filter(x=>q===1?x.dia<=15:x.dia>15).sort((a,b)=>a.dia-b.dia);
  return{items,total:items.reduce((a,x)=>a+x.m,0)};
}
V.servicios=()=>{
  const q1=quincena(1),q2=quincena(2);
  const bloque=(t,q)=>`<div class="card"><div class="row"><b>${t}</b><span class="amt">${fmt(q.total)}</span></div>${q.items.map(x=>`<div class="item"><span>Día ${x.dia} · ${esc(x.nombre)}${x.t==='prestamo'?'<span class="chip">préstamo</span>':''}</span><span class="amt">${fmt(x.m)}</span></div>`).join('')||'<div class="empty">—</div>'}</div>`;
  return`<button class="btn full" style="margin:0 0 12px" onclick="editarServicio()">+ Agregar servicio</button>
  ${S.servicios.slice().sort((a,b)=>a.proximo.localeCompare(b.proximo)).map(s=>{const[ic,tx]=semaforo(s.proximo);return`<div class="card"><div class="row"><b>${ic} ${esc(s.nombre)}</b><span class="amt">${fmt(s.monto)}</span></div>
   <div class="mu">${fechaCorta(s.proximo)} · ${tx} · ${s.frecuencia==='anual'?'Anual':'Mensual'} · día ${s.dia}</div>
   <div class="acts"><button class="btn sm" onclick="pagar('servicio','${s.id}')">Marcar pagado</button>${s.pagos.length?`<button class="btn sm sec" onclick="deshacer('servicio','${s.id}')">Deshacer</button>`:''}<button class="btn sm sec" onclick="editarServicio('${s.id}')">Editar</button><button class="btn sm sec" onclick="eliminar('servicios','${s.id}')">Eliminar</button></div></div>`}).join('')}
  <h2>Calendario por quincena</h2>${bloque('Quincena 1 (1–15)',q1)}${bloque('Quincena 2 (16–31)',q2)}
  <div class="card row"><b>Total mensual</b><span class="amt">${fmt(q1.total+q2.total)}</span></div>`;
};
V.prestamos=()=>{
  const tot=S.prestamos.filter(p=>p.cuotasRestantes>0).reduce((a,p)=>a+p.cuota,0);
  return`<div class="card row"><span class="mu">Cuotas mensuales</span><span class="amt neg">${fmt(tot)}</span></div>
  <button class="btn full" style="margin:0 0 12px" onclick="editarPrestamo()">+ Agregar préstamo</button>
  ${S.prestamos.map(p=>{const[ic,tx]=semaforo(p.proximo);const activo=p.cuotasRestantes>0;return`<div class="card"><div class="row"><b>${activo?ic:'✅'} ${esc(p.nombre)}</b><span class="amt">${fmt(p.cuota)}</span></div>
   <div class="mu">${activo?`${fechaCorta(p.proximo)} · ${tx} · `:''}Cuotas restantes: <b>${p.cuotasRestantes}</b> · Termina: ${fechaFin(p)}</div>
   ${p.saldo?`<div class="mu">Saldo: ${fmt(p.saldo)}</div>`:''}
   <div class="mu">Pendiente en cuotas: ${fmt(p.cuota*p.cuotasRestantes)}</div>
   <div class="acts">${activo?`<button class="btn sm" onclick="pagar('prestamo','${p.id}')">Marcar pagado</button>`:''}${p.pagos.length?`<button class="btn sm sec" onclick="deshacer('prestamo','${p.id}')">Deshacer</button>`:''}<button class="btn sm sec" onclick="editarPrestamo('${p.id}')">Editar</button><button class="btn sm sec" onclick="eliminar('prestamos','${p.id}')">Eliminar</button></div></div>`}).join('')}`;
};
V.movs=()=>{
  const ms=S.movs.filter(m=>m.fecha.startsWith(mesFiltro)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const ing=ms.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0), gas=ms.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  return`<div class="row" style="margin-bottom:12px"><input type="month" value="${mesFiltro}" onchange="mesFiltro=this.value||mesActual();render()" style="flex:1"><button class="btn" onclick="nuevoMov()">+ Nuevo</button></div>
  <div class="card"><div class="row"><span class="mu">Ingresos</span><span class="amt pos">${fmt(ing)}</span></div><div class="row"><span class="mu">Gastos</span><span class="amt neg">${fmt(gas)}</span></div><div class="row" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px"><b>Neto</b><span class="amt ${ing-gas<0?'neg':'pos'}">${fmt(ing-gas)}</span></div></div>
  <div class="card">${ms.length?ms.map(m=>{const s=m.tipo==='ingreso'?'+':m.tipo==='pagoTarjeta'?'⇄':'−';const cl=m.tipo==='ingreso'?'pos':m.tipo==='gasto'?'neg':'';
    return`<div class="item" onclick="delMov('${m.id}')"><div><div class="n">${esc(m.nota||m.categoria)}</div><div class="mu">${fechaCorta(m.fecha)} · ${esc(m.categoria)} · ${esc(nombreCuenta(m.cuenta))}</div></div><span class="amt ${cl}">${s} ${fmt(m.monto)}</span></div>`}).join('')+'<div class="mu" style="text-align:center;margin-top:8px">Toca un movimiento para eliminarlo</div>':'<div class="empty">Sin movimientos este mes</div>'}</div>`;
};
V.presupuesto=()=>{
  const g=gastosMes(mesActual());const cats=[...new Set([...CAT_GASTO,...Object.keys(g)])];
  const tp=Object.values(S.presupuesto).reduce((a,b)=>a+b,0), tg=Object.values(g).reduce((a,b)=>a+b,0);
  return`<div class="card"><div class="mu">Presupuesto mensual</div><div class="row"><div class="big">${fmt(tg)}</div><span class="mu">de ${fmt(tp)}</span></div>${tp?`<div class="bar"><i style="width:${Math.min(100,tg/tp*100)}%;background:${tg>tp?'var(--bad)':'var(--ok)'}"></i></div>`:''}</div>
  <button class="btn sec full" style="margin:0 0 12px" onclick="editarPresupuesto()">✏️ Editar límites</button>
  <div class="card">${cats.map(c=>{const lim=S.presupuesto[c]||0,u=g[c]||0,pc=lim?u/lim*100:0;if(!lim&&!u)return'';
   const col=pc>=100?'var(--bad)':pc>=80?'var(--warn)':'var(--ok)';
   return`<div class="item" style="display:block"><div class="row"><span class="n">${pc>=100?'🚨 ':pc>=80?'⚠️ ':''}${esc(c)}</span><span class="amt">${fmt(u)} <span class="mu">/ ${fmt(lim)}</span></span></div>${lim?`<div class="bar"><i style="width:${Math.min(100,pc)}%;background:${col}"></i></div><div class="mu" style="margin-top:4px">${pc>=100?`Excedido por ${fmt(u-lim)}`:`Quedan ${fmt(lim-u)}`}</div>`:'<div class="mu">Sin límite asignado</div>'}</div>`}).join('')||'<div class="empty">Asigna límites con “Editar límites”.</div>'}</div>`;
};
function editarPresupuesto(){
  form('Límites mensuales por categoría',CAT_GASTO.map(c=>({name:c,label:c,type:'number',value:S.presupuesto[c]||0})),d=>{CAT_GASTO.forEach(c=>S.presupuesto[c]=d[c])});
}
V.datos=()=>`<div class="card"><h2>Respaldo</h2><div class="mu">Tus datos viven solo en este iPhone. Haz un respaldo cada semana y guárdalo en Archivos o iCloud Drive.</div>
  <button class="btn full" onclick="exportar()">⬇️ Exportar respaldo (JSON)</button>
  <button class="btn sec full" onclick="copiar()">📋 Copiar respaldo al portapapeles</button></div>
  <div class="card"><h2>Restaurar</h2><input type="file" accept=".json,application/json" onchange="importarArchivo(this.files[0])">
  <label>…o pega el texto del respaldo</label><textarea id="pegado"></textarea><button class="btn sec full" onclick="importarTexto($('#pegado').value)">Restaurar desde texto</button></div>
  <div class="card"><div class="mu">${S.movs.length} movimientos · ${S.servicios.length} servicios · ${S.prestamos.length} préstamos · ${S.tarjetas.length} tarjetas</div>
  <button class="btn bad full" onclick="reiniciar()">Borrar todo y empezar de cero</button></div>`;
async function exportar(){
  const txt=JSON.stringify(S,null,1), nombre=`finanzas-${iso(hoy())}.json`;
  try{const f=new File([txt],nombre,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nombre});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=nombre;a.click();
}
async function copiar(){try{await navigator.clipboard.writeText(JSON.stringify(S));toast('📋 Copiado')}catch(e){toast('No se pudo copiar')}}
function importarTexto(t){
  try{const d=JSON.parse(t);if(!d.cuentas||!Array.isArray(d.movs))throw 0;if(!confirm('Esto reemplaza todos tus datos actuales. ¿Continuar?'))return;
    S=d;['tarjetas','servicios','prestamos'].forEach(k=>S[k]=S[k]||[]);S.presupuesto=S.presupuesto||{};save();render();toast('✅ Datos restaurados')}
  catch(e){alert('Archivo no válido. Usa un respaldo exportado desde esta app.')}
}
function importarArchivo(f){if(!f)return;const r=new FileReader();r.onload=()=>importarTexto(r.result);r.readAsText(f)}
function reiniciar(){if(confirm('¿Borrar TODO? Exporta un respaldo antes.')&&confirm('Confirmar de nuevo: se borrarán todos los datos.')){S=estadoInicial();save();render()}}

/* ---------- render ---------- */
function render(){
  $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k===tab?'on':''}" onclick="ir('${k}')"><span>${i}</span>${l}</button>`).join('');
  $('#titulo').textContent=TABS.find(t=>t[0]===tab)[2].replace('Movim.','Movimientos').replace('Presup.','Presupuesto');
  $('#app').innerHTML=V[tab]();
}
function ir(k){tab=k;render();window.scrollTo(0,0)}
$('#fechaHoy').textContent=hoy().toLocaleDateString('es-DO',{weekday:'short',day:'numeric',month:'short'});
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
